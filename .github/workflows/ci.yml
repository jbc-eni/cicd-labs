
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  # 1. Vérification du code avec Ruff
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff
      - run: ruff check . --output-format=github


  # 2. Tests avec plusieurs versions de Python
  unit:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests with coverage
        run: |
          pytest -n auto -m "unit or api" \
            --cov=minishop \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --junitxml=reports/junit.xml

      - name: Add coverage to job summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-python-${{ matrix.python }}
          path: |
            reports/
            htmlcov/
          if-no-files-found: warn


  # 3. Tests dans un conteneur Python
  container-test:
    needs: lint
    runs-on: ubuntu-latest

    container:
      image: python:3.12-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -m "unit or api"


  # 4. Construction et smoke test de l'image Docker
  docker:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t minishop .

      - name: Start container
        run: |
          docker run -d \
            --name minishop \
            -p 8000:8000 \
            minishop

      - name: Smoke test
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Application OK"
              exit 0
            fi
            sleep 2
          done

          echo "Application unavailable"
          docker logs minishop
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f minishop || true
